[project]
name = "astro-plasma"
version = "1.0.1"
description = "A Cloudy database with functions to quickly interpolate physical state of astrophysical plasma without detailed Plasma modelling."
authors = [
    {name = "Alankar Dutta", email = "dutta.alankar@gmail.com"},
]
# PEP 621 defines no `contributors` key, and `maintainers` is its nearest
# standard equivalent, so the two people codemeta.json lists as contributors go
# here.  PyPI renders this as Maintainer-email, separately from Author-email.
maintainers = [
    {name = "Gurkirat Singh", email = "tbhaxor@gmail.com"},
    {name = "Ritali Ghosh", email = "ritsg11@gmail.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "h5py>=3.7.0",
    "urllib3>=1.26.15",
    "python-dotenv==1.0.0",
    "scipy==1.17.1",
    "rich>=14.2.0",
    "colorama>=0.4.6",
    "webdav4>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.1.0",
    "ruff>=0.0.261",
    "mypy>=1.2.0",
    "types-requests>=2.28.11.17",
    "pre-commit>=3.3.1",
    "pytest>=7.4.3",
]
test = [
    "matplotlib>=3.7.1",
]
cloudy = [
    "mpi4py>=3.1.4",
]
gpu = [
    "cupy>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["astro_plasma"]
# .gitignore carries a bare `data/` rule, which hatchling honours, and which
# silently dropped these two tracked tables from the distributions.  They are
# read at runtime -- solar_GASS10.abn by Ionization.interpolate_num_dens and
# cooltable.dat by core.functions -- and the downloader never fetches them, so
# an installed wheel without them raises FileNotFoundError on first use.
# The bulk HDF5 tables under data/ionization and data/emission stay excluded on
# purpose: those are downloaded on demand.
artifacts = [
    "astro_plasma/data/solar_GASS10.abn",
    "astro_plasma/data/cooltable.dat",
]

[tool.hatch.build.targets.sdist]
artifacts = [
    "astro_plasma/data/solar_GASS10.abn",
    "astro_plasma/data/cooltable.dat",
]

# Ruff configurations
[tool.ruff]
line-length = 160

[tool.ruff.lint]
select = ["E", "F", "Q"]

[tool.ruff.lint.per-file-ignores]
"__init__.py"  = ["F401"]

# Black formatter configuration
[tool.black]
line-length = 160
target-version = ["py311"]
